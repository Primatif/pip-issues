<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="pip-issues-banner-title">
<title id="pip-issues-banner-title">A report travelling back to its maker, drawn as a feedback loop in pixel icons, the vintage green on the left meeting the psychic indigo on the right at one diagonal seam. On the left is a tester's machine, one of a stack. Its running app shows an alert. At a takeoff point the full story drops into the machine's own inbox, beside calendar, mail, chat, board, ticket and screenshot marks that never leave it. Along the top wire an agent passes the rest through a redacting gate, so only counts, ids, timings and blacked-out bars get through. The report, an issue card in four sections, crosses the seam into a summing junction where expected (+) meets what happened (−), and is filed at the head of a list of issues, most of them closed. The maker looks, fixes on a branch and checks the fix. The fix joins a release, and the release runs back along the bottom wire to the machine, where a pixel cat stands on it.</title>
<!-- pip-issues banner, "the report is the feedback path". 2026-10-22.
     One drawing (#art) in <defs>, drawn vintage everywhere, then psychic clipped right of one hard diagonal seam, (720,0) to
     (586,320), drawn over rather than abutted. The seam crosses exactly two things, both wires: the report wire at y=104 (x~676)
     and the release wire at y=285 (x~601). No glyph, pip, card or container is cut.
     Genre: a control-loop block diagram. Summing junction = circle, a sign on each input, the cross being an accepted variant;
     takeoff point = a dot (here, a pip). Error = expected (+) minus got (-): the issue template's Expected / Got lines.
     Loop runs clockwise: report path along the top (L to R), maker down the right, release along the ground line (R to L), up into
     the machine. One accent, traced through one report: the card, its row at the head of the list, its fix pip in the release (ringed).
     Every colour is a design-system role, and every glyph an 8x8 grid from the house pixel set, carried exactly. Whole pixel
     scales only: monitor 6x, alert 3x, inbox / book / search / branch / check / download / cat 4x, kept-home marks and agent 2x,
     clock and check in the list 1x. Nothing is named and nothing is linked. -->
